version: "3"

tasks:
  server:
    desc: Run the PsycoSupport server on 127.0.0.1:5000 (needs Ollama running)
    cmds:
      - uv run python psycare_lab/server.py

  client:
    desc: Run the PsycoSupport terminal client (needs the /etc/hosts entry for muhammadrafique)
    cmds:
      - uv run python psycare_lab/client.py

  check-env:
    desc: Check the uv environment imports the app's dependencies
    cmds:
      - uv run python -c "import ollama, requests; print('ok')"

  ollama-check:
    desc: Show installed Ollama models and confirm the Ollama API answers on localhost:11434
    cmds:
      - ollama list
      - curl -s localhost:11434/api/tags

  offline-proof:
    desc: Turn networking off, show the model still answers, turn networking back on
    cmds:
      - defer: nmcli networking on
      - nmcli networking off
      - sleep 3
      - nmcli networking
      - curl -sS -m 5 https://ollama.com -o /dev/null || true
      - ollama run llama3.2 "Say hi in five words"
