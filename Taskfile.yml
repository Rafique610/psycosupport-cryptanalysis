version: "3"

tasks:
  server:
    desc: Run the PsycoSupport server on 127.0.0.1:5000 (needs Ollama running)
    cmds:
      - uv run python psycare_lab/server.py

  client:
    desc: Run the PsycoSupport terminal client (needs the /etc/hosts entry for muhammadrafique)
    cmds:
      - uv run python psycare_lab/client.py

  check-env:
    desc: Check the uv environment imports the app's dependencies
    cmds:
      - uv run python -c "import ollama, requests; print('ok')"

  ollama-check:
    desc: Show installed Ollama models and confirm the Ollama API answers on localhost:11434
    cmds:
      - ollama list
      - curl -s localhost:11434/api/tags

  offline-proof:
    desc: Turn networking off, show the model still answers, turn networking back on
    cmds:
      - defer: nmcli networking on
      - nmcli networking off
      - sleep 3
      - nmcli networking
      - curl -sS -m 5 https://ollama.com -o /dev/null || true
      - ollama run llama3.2 "Say hi in five words"

  capture:
    desc: Capture loopback traffic on tcp port 5000 to evidence/task2/session_all.pcap (Ctrl+C to stop)
    cmds:
      - mkdir -p evidence/task2
      - dumpcap -i lo -f "tcp port 5000" -w evidence/task2/session_all.pcap

  run-cases:
    desc: Run the 5 synthetic test cases through the real client (server must be running)
    cmds:
      - uv run python scripts/capture/run_cases.py

  extract:
    desc: Extract all ciphertexts from evidence/task2/session_all.pcap into ciphertexts.csv
    cmds:
      - uv run python scripts/capture/extract_ciphertexts.py

  freq:
    desc: Frequency analysis of ciphertexts.csv - tables, patterns, candidate mapping, charts (report/figures/)
    dir: scripts/frequency
    cmds:
      - uv run python count.py
      - uv run python patterns.py
      - uv run python plot.py

  recover:
    desc: Recover the affine key (a, b) from the frequency mapping, with full working and a chi-squared cross-check
    dir: scripts/cipher
    cmds:
      - uv run python recover_key.py

  decrypt:
    desc: Decrypt all 20 ciphertexts with the recovered key and verify them against ground truth
    dir: scripts/cipher
    cmds:
      - uv run python decrypt_all.py

  report:
    desc: Assemble report.pdf from report/sections/*.md (WeasyPrint)
    cmds:
      - uv run python scripts/report/build_report.py

  package:
    desc: Build the submission ZIP (report.pdf, ciphertexts.csv, scripts/, evidence/) in dist/
    cmds:
      - uv run python scripts/package.py
