<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="DejaVu Sans, sans-serif" font-size="13">
  <rect width="760" height="250" fill="#fcfcfb"/>
  <rect x="10" y="10" width="740" height="230" rx="8" fill="none" stroke="#a9a8a3" stroke-dasharray="5 4"/>
  <text x="22" y="30" fill="#52514e" font-size="12">Kali Linux host (offline)</text>
  <rect x="30" y="60" width="170" height="90" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="115" y="85" text-anchor="middle" font-weight="bold" fill="#0b0b0b">client.py</text>
  <text x="115" y="105" text-anchor="middle" fill="#52514e">username, mood,</text>
  <text x="115" y="122" text-anchor="middle" fill="#52514e">concern → E(x)</text>
  <text x="115" y="139" text-anchor="middle" fill="#52514e">D(y) → print reply</text>
  <rect x="300" y="60" width="170" height="90" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="385" y="85" text-anchor="middle" font-weight="bold" fill="#0b0b0b">server.py</text>
  <text x="385" y="105" text-anchor="middle" fill="#52514e">D(x) → ask model</text>
  <text x="385" y="122" text-anchor="middle" fill="#52514e">+ disclaimer</text>
  <text x="385" y="139" text-anchor="middle" fill="#52514e">E(reply)</text>
  <rect x="570" y="60" width="160" height="90" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="650" y="85" text-anchor="middle" font-weight="bold" fill="#0b0b0b">Ollama</text>
  <text x="650" y="105" text-anchor="middle" fill="#52514e">llama3.2 (3B)</text>
  <text x="650" y="122" text-anchor="middle" fill="#52514e">CPU inference</text>
  <text x="650" y="139" text-anchor="middle" fill="#52514e">:11434</text>
  <line x1="200" y1="92" x2="296" y2="92" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="300" y1="122" x2="204" y2="122" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="250" y="84" text-anchor="middle" font-size="11" fill="#52514e">POST /submit</text>
  <text x="250" y="138" text-anchor="middle" font-size="11" fill="#52514e">{"reply": …}</text>
  <line x1="470" y1="105" x2="566" y2="105" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="566" y1="118" x2="474" y2="118" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="250" y="190" text-anchor="middle" fill="#eb6834" font-weight="bold">lo · 127.0.0.1:5000 · HTTP</text>
  <line x1="250" y1="150" x2="250" y2="175" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="160" y="200" width="180" height="30" rx="5" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="250" y="220" text-anchor="middle" fill="#0b0b0b">dumpcap / Wireshark</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker></defs>
</svg>
